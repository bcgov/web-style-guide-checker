name: Bug report
description: Report incorrect extension behaviour or a reproducible problem.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, cookies, sign-in tokens, protected page content or security vulnerability details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.3.2
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use public or safely redacted examples.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include the site type and review scope when relevant.
